# 워크플로우(작업) 이름
name: GitOps CI Pipeline

on:
  push:
    branches: ["main"]

#testtest1
jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      # GitHub Repository 코드 가져오기
      - name: 소스코드 전송
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USER}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and push Dcoker image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: "rladmswlr/nginx:1.31.3-cd"

      # AWS 자격 증명 설정
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.S3_REGION }}
      
      - name: S3 정적 웹사이트로 배포
        run: |
          aws s3 cp ./docker-compose.yaml \
            s3://std16-test-bucket/docker-compose.yaml

          aws s3 sync ./nginx/html \
            s3://std16-test-bucket/html/ \
            --delete

      # ECR에 Docker 이미지 빌드 및 푸시
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        run: |
          # nginx 이미지 빌드
          docker build --no-cache \
            -t 925047940866.dkr.ecr.us-east-2.amazonaws.com/nginx:1.31.3-ecr \
            -t 925047940866.dkr.ecr.us-east-2.amazonaws.com/nginx:latest \
            ./nginx

          # FastAPI 이미지 빌드
          docker build --no-cache \
            -t 925047940866.dkr.ecr.us-east-2.amazonaws.com/fastapi:latest \
            ./fastapi

          # ECR Push
          docker push 925047940866.dkr.ecr.us-east-2.amazonaws.com/nginx:1.31.3-ecr
          docker push 925047940866.dkr.ecr.us-east-2.amazonaws.com/nginx:latest
          docker push 925047940866.dkr.ecr.us-east-2.amazonaws.com/fastapi:latest
          
          
      # GitHub → S3 → Private EC2
      - name: 컨테이너 배포 및 S3 파일 싱크
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Cicd,Values=asg" \
            --parameters "commands=[
              \"aws ecr get-login-password --region us-east-2 | sudo docker login --username AWS --password-stdin 925047940866.dkr.ecr.us-east-2.amazonaws.com\",
              \"sudo docker stop nginx-container || true\",
              \"sudo docker rm nginx-container || true\",
              \"sudo mkdir -p /home/ec2-user/nginx/html\",
              \"sudo chown -R ec2-user:ec2-user /home/ec2-user/nginx\",
              \"sudo aws s3 sync s3://std16-test-bucket/html/ /home/ec2-user/nginx/html/ --delete\",
              \"sudo aws s3 cp s3://std16-test-bucket/docker-compose.yaml /home/ec2-user/docker-compose.yaml\",
              \"sudo docker compose -f /home/ec2-user/docker-compose.yaml pull\",
              \"sudo docker compose -f /home/ec2-user/docker-compose.yaml up -d --remove-orphans\",
              \"sudo docker image prune -f\"
            ]" \
            --region "${{ secrets.S3_REGION }}" \
            --comment "Deploying SSM docker"