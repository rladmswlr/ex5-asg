services:
  my-service-web:
    image: 925047940866.dkr.ecr.us-east-2.amazonaws.com/nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    # volumes:
    #   - /home/ec2-user/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    #   - /home/ec2-user/nginx/html:/usr/share/nginx/html:ro
    #   - /home/ec2-user/nginx/logs:/var/log/nginx
    restart: always
    depends_on:
      - fastapi
    # networks:
    #   - public-subnet
    #     aliases:
    #       - nginx

  fastapi:
    image: 925047940866.dkr.ecr.us-east-2.amazonaws.com/fastapi:latest
    container_name: fastapi-container
    expose:
      - "8000"
    restart: always

